            - tag: "component"
              value: "system"
            - tag: "device"
              value: "storage-array"
            - tag: "metric"
              value: "inventory"
          delay: "1h"
          history: "30d"
          value_type: "CHAR"
          trends: "0"
        - uuid: "6611c8e4b1fd40228889e4e59a84cc46"
          name: "Wersja oprogramowania"
          type: "SNMP_AGENT"
          snmp_oid: "get[.1.3.6.1.4.1.674.11000.2000.500.1.2.4.0]"
