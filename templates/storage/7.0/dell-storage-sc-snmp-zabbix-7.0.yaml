zabbix_export:
  version: "7.0"
  template_groups:
    - uuid: "76251ddbadda44148b65523b20068154"
      name: "Templates/SAN"
  templates:
    - uuid: "8977aae6e4424f9f81d0f4e4297cc34f"
      template: "Dell Storage SC by SNMP"
      name: "Dell Storage SC by SNMP"
      description: "Monitorowanie Dell Storage Center (Compellent) według DELL-STORAGE-SC-MIB. W konfiguracji hosta dodaj interfejs SNMP z adresem zarządzającym macierzy oraz danymi dostępu SNMPv2c lub SNMPv3. Dostępność tabel zależy od modelu i wersji SCOS. Przestrzeń nieprzydzielona odpowiada pozycji Unallocated disk space w interfejsie Storage Center."
      groups:
        - name: "Templates/SAN"
      tags:
        - tag: "class"
          value: "storage"
        - tag: "target"
          value: "dell"
        - tag: "target"
          value: "storage-sc"
      items:
        - uuid: "bb46f9b77d3d42cb8b65e44e5fa2ed80"
          name: "Status całej macierzy"
          type: "SNMP_AGENT"
          snmp_oid: "get[.1.3.6.1.4.1.674.11000.2000.500.1.2.6.0]"
          key: "dell.sc.productIDGlobalStatus"
          tags:
            - tag: "component"
              value: "health"
            - tag: "device"
              value: "storage-array"
            - tag: "metric"
              value: "status"
          delay: "2m"
          history: "30d"
          valuemap:
            name: "Status macierzy"
        - uuid: "d4f64349ce22493983fbbf6afe9f2b3b"
          name: "Nazwa produktu"
          type: "SNMP_AGENT"
          snmp_oid: "get[.1.3.6.1.4.1.674.11000.2000.500.1.2.1.0]"
          key: "dell.sc.productIDDisplayName"
